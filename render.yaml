services:
  - type: web
    name: gymflow
    runtime: node
    plan: starter
    region: oregon
    branch: main
    buildCommand: npm install
    startCommand: npm run seed && npm start
    disk:
      name: gymflow-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DB_PATH
        value: /var/data/gym.db
      - key: JWT_SECRET
        generateValue: true
